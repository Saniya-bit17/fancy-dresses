services:
  - type: web
    name: maison-solene-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_NAME
        value: maison_solene
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
